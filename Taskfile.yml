version: '3'

tasks:
  clean:
    desc: clean up
    cmds:
      - find . -type d -name .pytest_cache -exec rm -rf {} \; || true
      - find . -type d -name __pycache__ -exec rm -rf {} \; || true
      - find . -type d -name .ten -exec rm -rf {} \; || true
      - find . -name .coverage -exec rm -f {} \; || true

  install:
    desc: install dependencies
    cmds:
      - tman install --standalone
      - pip install -r requirements.txt
      - pip install -r tests/requirements.txt

  lint:
    desc: lint codes
    env:
      PYTHONPATH: "{{.USER_WORKING_DIR}}/.ten/app:{{.USER_WORKING_DIR}}/.ten/app/ten_packages/system/ten_runtime_python/lib:{{.USER_WORKING_DIR}}/.ten/app/ten_packages/system/ten_runtime_python/interface"
    cmds:
      -  pylint ./interface/ten_ai_base/*.py {{ .CLI_ARGS }}

  test:
    desc: run tests
    cmds:
      - task: test-standalone
      - task: test-integration

  test-standalone:
    desc: run standalone tests
    cmds: 
      - ./tests/bin/start {{ .CLI_ARGS }}

  test-cpp-deps:
    desc: install C++ test dependencies (googletest, nlohmann_json)
    cmds:
      - tman install --standalone

  test-cpp:
    desc: run C++ unit tests
    vars:
      GTEST: '{{.USER_WORKING_DIR}}/.ten/app/ten_packages/system/googletest'
      NLOHMANN: '{{.USER_WORKING_DIR}}/.ten/app/ten_packages/system/nlohmann_json/include'
      OUT: '{{.USER_WORKING_DIR}}/tests/cpp/util_test_bin'
    cmds:
      - task: test-cpp-deps
      - |
        g++ -std=c++14 \
          -I"{{.USER_WORKING_DIR}}/include" \
          -I"{{.NLOHMANN}}" \
          -I"{{.GTEST}}/include" \
          -I"{{.GTEST}}" \
          "{{.GTEST}}/src/gtest-all.cc" \
          "{{.USER_WORKING_DIR}}/src/ten_ai_base/utils.cc" \
          "{{.USER_WORKING_DIR}}/tests/cpp/gtest_main.cc" \
          "{{.USER_WORKING_DIR}}/tests/cpp/util_test.cc" \
          -pthread \
          -o "{{.OUT}}"
      - '{{.OUT}} {{ .CLI_ARGS }}'

  test-integration:
    desc: run integration tests
    vars:
      EXTENSIONS:
        sh: 'find integration_tests -type d -exec test -d "{}/tests" \; -print'
    cmds:
      - for: { var: EXTENSIONS }
        task: test-extension
        vars:
          EXTENSION: '{{ .ITEM }}'

  test-extension:
    desc: run standalone testing of one single extension
    vars:
      EXTENSION: '{{.EXTENSION| default "test_config_python"}}'
    env:
      PYTHONPATH: "{{.USER_WORKING_DIR}}/interface:{{.USER_WORKING_DIR}}"
    cmds:
      - cd {{.EXTENSION}} && tman -y install --standalone && ./tests/bin/start {{ .CLI_ARGS }}