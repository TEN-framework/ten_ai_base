version: '3'

tasks:
  prepare:
    desc: Install the TEN runtime and sync the uv-managed Python environment
    cmds:
      - tman install --standalone
      - bash scripts/apply_ten_runtime_python_patch.sh
      - uv sync --project dev

  install:
    desc: Alias for prepare
    cmds:
      - task: prepare

  clean:
    desc: Remove generated TEN and Python test artifacts
    cmds:
      - find . -type d -name .pytest_cache -prune -exec rm -rf {} +
      - find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - find . -type d -name .ten -prune -exec rm -rf {} +
      - find . -name .coverage -delete

  lint:
    desc: Run Ruff against the OTel package and its contract tests
    cmds:
      - uv run --project dev ruff check interface/ten_ai_base/otel tests/test_otel.py tests/test_tts2_tracing.py

  test:
    desc: Run standalone and integration tests
    cmds:
      - task: test-standalone
      - task: test-integration

  test-standalone:
    desc: Run the package's standalone tests
    cmds:
      - ./tests/bin/start {{ .CLI_ARGS }}

  test-integration:
    desc: Run all integration test packages
    vars:
      EXTENSIONS:
        sh: find integration_tests -type d -exec test -d "{}/tests" \; -print
    cmds:
      - for: { var: EXTENSIONS }
        task: test-extension
        vars:
          EXTENSION: '{{ .ITEM }}'

  test-extension:
    desc: Run one integration test package
    vars:
      EXTENSION: '{{.EXTENSION | default "integration_tests/test_config_python"}}'
    cmds:
      - cd {{.EXTENSION}} && tman install --standalone && uv run --project {{.ROOT_DIR | shellQuote}}/dev ./tests/bin/start {{ .CLI_ARGS }}
